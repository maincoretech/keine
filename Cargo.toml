[workspace]
resolver = "2"
members = [
    "crates/*",
]
default-members = ["."]

[package]
name = "keine"
version.workspace = true
edition.workspace = true
description = "Kēne, a native visual-novel engine with WebGAL and LetsGal compatibility"
repository = "https://github.com/maincoretech/keine"
default-run = "keine"

[lib]
bench = false

[[bin]]
name = "keine"
path = "src/main.rs"
# Criterion benches exercise the library; linking the full GUI binary with
# release LTO adds several minutes without contributing a measurement.
bench = false

[[bin]]
name = "keine-video-acceptance"
path = "dev/tools/video_acceptance.rs"
required-features = ["publisher"]
test = false
bench = false

[[bin]]
name = "keine-video-source-benchmark"
path = "dev/tools/video_source_benchmark.rs"
required-features = ["publisher"]
test = false
bench = false

[features]
default = ["audio-all", "ui-sounds"]
audio-all = ["bundled-opus", "audio-wav", "audio-mp3", "audio-vorbis", "audio-flac"]
ui-sounds = ["bundled-opus"]
# Only the `keine bundle` engine build enables this: developer builds stay
# fully debuggable. Raises the cost of runtime key extraction (debugger
# attach, core dumps), see `platform::apply_hardening`.
hardened = ["dep:libc", "dep:windows-sys"]
# Benchmark-only process memory counters. Normal game builds do not include
# the platform APIs or execute their sampling path.
startup-metrics = ["dep:libc", "dep:windows-sys"]
# Publisher-only compiler and Hakutaku packer. Release game engines deliberately
# omit this feature and link only hakutaku-core through keine-loader.
publisher = [
    "dep:hakutaku-core",
    "dep:hakutaku-pack",
    "dep:noyalib",
    "dep:serde_json",
    "dep:tempfile",
]
audio-opus = ["dep:rodio", "dep:symphonia", "dep:symphonia-adapter-libopus"]
bundled-opus = ["audio-opus", "symphonia-adapter-libopus/bundled"]
audio-seekable = ["dep:rodio"]
audio-wav = ["audio-seekable", "bevy/wav"]
audio-mp3 = ["audio-seekable", "bevy/mp3"]
# Symphonia provides random access for the gallery player. Bevy's alternative
# Lewton and Claxon backends can decode these formats but cannot seek them.
audio-vorbis = ["audio-seekable", "bevy/symphonia-vorbis"]
audio-flac = ["audio-seekable", "bevy/symphonia-flac"]
video-ffmpeg = ["dep:ffmpeg-next", "dep:rodio", "dep:crossbeam-channel"]
video-native = [
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
    "dep:objc2-metal",
    "dep:dispatch2",
    "dep:wgpu",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.97.1"

# Disable icu_provider's debug eprintln! fallback in dev builds.
# Without this, icu_provider prints "ICU4X data error: ..." to stderr
# every frame when debug_assertions is enabled (dev profile default),
# even with the "logging" feature disabled.
[profile.dev]
# Interactive development processes full-HD pixels every frame. A small amount of
# optimization keeps `cargo dev` representative without turning it into a slow
# release build or removing useful debug information.
opt-level = 1
debug = 1

[profile.dev.package.icu_provider]
debug-assertions = false

# Shipping profile: smaller and faster at the cost of slower release builds.
# LTO removes cross-crate duplication, strip drops the symbol table, and
# panic=abort removes unwind tables (a release panic terminates the process;
# graceful paths like startup_error and AppExit are unaffected).
[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
keine-core = { path = "crates/core" }
keine-loader = { path = "crates/loader" }
keine-media = { path = "crates/media" }

log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
unicode-segmentation = "1.13"
crc32fast = "1"
criterion = "0.5"
crossbeam-channel = "0.5"
notify = "8.2"
noyalib = { version = "0.0.15", default-features = false, features = ["std", "fast-int", "fast-float"] }
hakutaku-core = { git = "https://github.com/maincoretech/hakutaku", rev = "24c39ea" }
hakutaku-pack = { git = "https://github.com/maincoretech/hakutaku", rev = "24c39ea" }
libc = "0.2"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
bevy = { version = "0.19", default-features = false }
libwebp-sys = "0.14.4"
futures-lite = "2"
rfd = { version = "0.17.2", default-features = false }
webbrowser = "1"
rodio = { version = "0.22.2", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["ogg"] }
symphonia-adapter-libopus = { version = "0.3", default-features = false }
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
tempfile = "3"
winit = { version = "0.30.13", default-features = false }
wgpu = { version = "29.0.4", default-features = false, features = ["metal"] }
crossterm = "0.29.0"
fs2 = "0.4"

# Bevy 0.19 requests synthetic macOS redraws from `about_to_wait`. The pinned
# fix keeps reactive idle asleep while preserving redraw-driven continuous
# animation. Drop this override once upstream provides equivalent behavior.
[patch.crates-io]
bevy_winit = { git = "https://github.com/maincoretech/keine", rev = "916ee960f9cf571a3fe6c009aaa6f0667f69a060" }

[dependencies]
keine-core = { workspace = true }
keine-loader = { workspace = true }
keine-media = { workspace = true }
log = { workspace = true }
postcard = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
futures-lite = { workspace = true }
notify = { workspace = true }
rfd = { workspace = true }
webbrowser = { workspace = true }
rodio = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
symphonia-adapter-libopus = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
winit = { workspace = true }
crossterm = { workspace = true }
fs2 = { workspace = true }
bevy = { workspace = true, features = ["bevy_winit", "bevy_log", "bevy_render", "bevy_sprite", "bevy_ui", "bevy_ui_render", "bevy_audio", "png", "jpeg"] }
hakutaku-core = { workspace = true, optional = true }
hakutaku-pack = { workspace = true, optional = true }
noyalib = { workspace = true, optional = true }

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
criterion = { workspace = true }
crossbeam-channel = { workspace = true }
libwebp-sys = { workspace = true }

[[bench]]
name = "save_preview"
harness = false

[[bench]]
name = "backup_decode"
harness = false

[[bench]]
name = "video_queue"
harness = false

[[bench]]
name = "runtime_hotspots"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSRunLoop", "NSValue", "NSString", "NSURL"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, optional = true, features = ["std", "AVAsset", "AVAssetResourceLoader", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, optional = true, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, optional = true, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVPixelBuffer", "CVReturn", "objc2", "objc2-metal"] }
objc2-metal = { version = "0.3.2", default-features = false, optional = true, features = ["MTLDevice", "MTLPixelFormat", "MTLTexture"] }
dispatch2 = { version = "0.3.1", optional = true }
wgpu = { workspace = true, optional = true }

# Hardening is compiled in only by `keine bundle` (feature `hardened`); the
# dependencies stay target-gated so unused-crate-dependencies never fires on
# platforms that cannot use them.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

# Winit has no implicit Linux backend when Bevy's default features are disabled.
# X11 also covers Wayland desktops through XWayland without adding native
# Wayland development libraries to release builds.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11"] }
rfd = { workspace = true, features = ["xdg-portal"] }
