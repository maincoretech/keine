plugins {
    id 'com.android.application'
}

android {
    // NativeActivity has no Kotlin sources or standard-library dependency.
    enableKotlin = false
    namespace = 'moe.maincore.keine'
    compileSdk = 35
    buildToolsVersion = '36.0.0'
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = providers.gradleProperty('engineApplicationId').orElse('moe.maincore.keine').get()
        manifestPlaceholders = [engineTitle: providers.gradleProperty('engineTitle').orElse('Kēne Engine').get()]
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = providers.gradleProperty('engineVersion').orElse('development').get()
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            // The tday workflow is a playtest channel, not store publication.
            signingConfig = signingConfigs.debug
        }
    }

    androidResources {
        noCompress += ['haku', 'taku']
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../../../target/android/jniLibs']
            assets.srcDirs = ['../../../target/android/notices']
            if (providers.gradleProperty('engineGameDir').isPresent()) {
                assets.srcDir(providers.gradleProperty('engineGameDir').get())
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

tasks.named('preBuild') {
    doFirst {
        def engine = file('../../../target/android/jniLibs/arm64-v8a/libkeine.so')
        if (!engine.isFile() || engine.length() == 0) {
            throw new GradleException('Build the Engine first with dev/scripts/build-android.sh')
        }
    }
}
