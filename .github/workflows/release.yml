name: encrypted-release

# Release is manual-only: the archive password is supplied at dispatch time
# and is never stored as a repository secret.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to package
        required: true
        default: projects/test-project
      hexzPassword:
        description: HEXZ archive password used to encrypt game.hxz
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: keine-linux
          - os: macos-latest
            artifact: keine-macos
          - os: windows-latest
            artifact: keine-windows
    runs-on: ${{ matrix.os }}
    env:
      HEXZ_PASSWORD: ${{ inputs.hexzPassword }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Detect project media features
        shell: bash
        run: |
          source dev/scripts/audio-features.sh
          features="$(detect_audio_features "${{ inputs.project }}")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
      - name: Install pinned Hexz CLI
        shell: bash
        run: >-
          cargo install --locked --git https://github.com/maincoretech/hexz_k
          --rev 4cf5287 --no-default-features --features cli
      - name: Build encrypted release package
        shell: bash
        run: >-
          bash dev/scripts/package-release.sh
          "${{ inputs.project }}"
          "target/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
