name: Release Engine

# tday is built only on an explicit manual request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tday
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}
  KEINE_BUILD_COMMIT: ${{ github.sha }}
  RELEASE_TAG: tday-latest

jobs:
  source:
    name: Prepare Source
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Check dependencies before building any platform
        uses: ./.github/actions/check-dependencies

  bundle:
    name: Build ${{ matrix.name }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            # Shipping floor: GLIBC 2.39, including all bundled native libraries.
            os: ubuntu-24.04
            artifact: keine-linux
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: macOS arm64
            os: macos-26
            artifact: keine-macos
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: Windows x64
            os: windows-2025
            artifact: keine-windows-x64
            target: x86_64-pc-windows-msvc
            engine_target_dir: x86_64-pc-windows-msvc
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    env:
      KEINE_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Resolve project input
        id: project
        shell: bash
        env:
          PROJECT_INPUT: projects/tday
        run: |
          if [[ "$PROJECT_INPUT" == *$'\n'* || "$PROJECT_INPUT" == *$'\r'* ]]; then
            echo 'Project path must not contain line breaks' >&2
            exit 2
          fi
          if [[ ! -d "$PROJECT_INPUT" ]]; then
            echo "Project directory does not exist: $PROJECT_INPUT" >&2
            exit 2
          fi
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          project="$(cd "$PROJECT_INPUT" && pwd -P)"
          case "$project" in
            "$workspace"|"$workspace"/*) ;;
            *)
              echo "Project directory must stay inside the checkout: $project" >&2
              exit 2
              ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"
      - name: Detect canonical shipping features
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          source dev/scripts/shipping-features.sh
          features="$(detect_shipping_features "$PROJECT_PATH")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
          # Cargo uses commas; Actions cache keys forbid them.
          echo "KEINE_RELEASE_CACHE_FEATURES=${features//,/-}" >> "$GITHUB_ENV"
      - name: Resolve artifact name
        id: artifact
        shell: bash
        env:
          ARTIFACT_BASE: ${{ matrix.artifact }}
        run: |
          artifact="tday-${ARTIFACT_BASE#keine-}-test"
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - name: Restore Rust release cache
        id: release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Bundle outputs also live under target/, so cache only Cargo's
          # release trees rather than archiving the finished distributions.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/CACHEDIR.TAG
            target/${{ matrix.engine_target_dir }}
            target/runner
          key: release-rust-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_CACHE_FEATURES }}-publisher-fast
          restore-keys: |
            release-rust-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_CACHE_FEATURES }}-
            release-rust-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            release-rust-v1-${{ matrix.os }}-${{ runner.arch }}-
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
          windows-triplet: ${{ matrix.triplet }}
      - name: Build publisher runner
        # Build tooling needs no whole-program LTO; shipping builds retain it.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        # A separate target dir keeps the running publisher out of the engine
        # rebuild that `keine bundle` performs inside target/release.
        run: cargo build --release --locked --no-default-features --features publisher --target-dir target/runner --bin keine
      - name: Prepare publisher identity path
        id: publisher_identity
        shell: bash
        run: |
          umask 077
          identity_dir="${RUNNER_TEMP//\\//}/keine-release-secrets"
          mkdir -p "$identity_dir"
          echo "path=$identity_dir/publisher.key" >> "$GITHUB_OUTPUT"
          echo 'Using an isolated temporary publisher identity for this platform bundle'
      - name: Bundle encrypted release
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          KEINE_HAKUTAKU_IDENTITY: ${{ steps.publisher_identity.outputs.path }}
        run: |
          args=(bundle "$PROJECT_PATH" --output "target/${{ steps.artifact.outputs.name }}")
          target/runner/release/keine "${args[@]}"
      - name: Remove publisher identity
        if: always()
        shell: bash
        env:
          PUBLISHER_IDENTITY_PATH: ${{ steps.publisher_identity.outputs.path }}
        run: rm -f "$PUBLISHER_IDENTITY_PATH"
      - name: Verify Linux runtime closure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -x "target/${{ steps.artifact.outputs.name }}/keine"
          if [[ "$KEINE_RELEASE_FEATURES" == *video-ffmpeg* ]]; then
            test -d "target/${{ steps.artifact.outputs.name }}/lib"
            readelf -d "target/${{ steps.artifact.outputs.name }}/keine" | grep -F '(RPATH)' | grep -F '$ORIGIN/lib'
          fi
      - name: Verify Windows FFmpeg runtime
        if: runner.os == 'Windows' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: pwsh
        run: |
          $root = 'target/${{ steps.artifact.outputs.name }}'
          if (-not (Test-Path (Join-Path $root 'keine.exe'))) { throw 'keine.exe is missing' }
          if (Get-ChildItem $root -Filter '*.dll') { throw 'Runtime DLLs must be inside lib' }
          if (-not (Get-ChildItem (Join-Path $root 'lib') -Filter '*.dll')) { throw 'FFmpeg runtime DLLs are missing' }
          if (-not (Test-Path (Join-Path $root 'lib/lib.manifest'))) { throw 'Runtime assembly manifest is missing' }
          # Do not let the SDK's PATH mask a broken private assembly.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $executable = (Resolve-Path (Join-Path $root 'keine.exe')).Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $executable --version
            if ($LASTEXITCODE -ne 0) { throw 'Packaged executable cannot load lib from an unrelated cwd' }
          } finally { Pop-Location }
      - name: Archive executable permissions before artifact upload
        shell: bash
        run: |
          mkdir -p bundles
          python3 - <<'PYTHON'
          import shutil
          shutil.make_archive('bundles/${{ steps.artifact.outputs.name }}', 'zip', 'target/${{ steps.artifact.outputs.name }}')
          PYTHON
      - name: Verify final Linux archive
        if: runner.os == 'Linux'
        uses: ./.github/actions/verify-linux-package
        with:
          package: bundles/${{ steps.artifact.outputs.name }}.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: bundles/${{ steps.artifact.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove key-bearing compiler outputs before cache save
        id: scrub
        if: always()
        shell: bash
        run: |
          # Cache restore and the separate publisher build can create target/
          # before Cargo writes its tag. Cargo 1.97 requires it for explicit clean.
          if [[ -d target && ! -f target/CACHEDIR.TAG ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > target/CACHEDIR.TAG
          fi
          args=(--locked --target-dir target -p keine -p keine-loader)
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          cargo clean "${args[@]}" --profile release
          echo 'cache-safe=true' >> "$GITHUB_OUTPUT"
      - name: Save sanitized dependencies even after validation failure
        if: ${{ !cancelled() && steps.scrub.outputs.cache-safe == 'true' && steps.release-cache.outputs.cache-primary-key != '' && steps.release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/CACHEDIR.TAG
            target/${{ matrix.engine_target_dir }}
            target/runner
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  android:
    name: Build Android arm64
    needs: source
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: 'false'
      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android
        with:
          cache-disabled: 'true'
      - name: Restore Android release dependencies
        # First game build can reuse Engine CI dependencies. This cache is
        # restore-only: game keys and APKs must never be saved under its key.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
            target/icon-tool
          key: android-arm64-ubuntu26-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.RELEASE_SHA }}
          restore-keys: |
            android-arm64-ubuntu26-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Restore isolated Android release cache
        id: release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android/CACHEDIR.TAG
            target/android/release
            target/android/aarch64-linux-android/release
            target/runner
          key: release-android-arm64-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-publisher-fast
          restore-keys: |
            release-android-arm64-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Build publisher runner
        # Build tooling needs no whole-program LTO; shipping builds retain it.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked --no-default-features --features publisher --target-dir target/runner --bin keine
      - name: Bundle encrypted Android release
        env:
          KEINE_BUILD_TARGET: aarch64-linux-android
          KEINE_HAKUTAKU_IDENTITY: ${{ runner.temp }}/keine-android-release-secrets/publisher.key
        run: |
          umask 077
          mkdir -p "$(dirname "$KEINE_HAKUTAKU_IDENTITY")"
          mkdir -p bundles
          target/runner/release/keine bundle projects/tday --output target/tday-android-arm64-test
          echo 'ANDROID_OUTPUT=target/tday-android-arm64-test' >> "$GITHUB_ENV"
          echo 'ANDROID_ARTIFACT=tday-android-arm64-test' >> "$GITHUB_ENV"
      - name: Check Android release lint
        run: gradle --no-daemon -p dev/android lintRelease
      - name: Verify Android release package
        run: |
          python3 dev/scripts/verify-android-release.py "$ANDROID_OUTPUT/game.apk" "$ANDROID_OUTPUT/ANDROID.json"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$ANDROID_OUTPUT/game.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$ANDROID_OUTPUT/game.apk"
          cp "$ANDROID_OUTPUT/game.apk" "bundles/$ANDROID_ARTIFACT.apk"
      - name: Upload Android release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ANDROID_ARTIFACT }}
          path: bundles/${{ env.ANDROID_ARTIFACT }}.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove publisher identity and key-bearing outputs before cache save
        id: scrub
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/keine-android-release-secrets/publisher.key"
          if [[ -d target/android && ! -f target/android/CACHEDIR.TAG ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > target/android/CACHEDIR.TAG
          fi
          if [[ -f target/android/CACHEDIR.TAG ]]; then
            cargo clean --locked --target-dir target/android -p keine -p keine-loader --profile release
            cargo clean --locked --target-dir target/android --target aarch64-linux-android -p keine -p keine-loader --profile release
          fi
          echo 'cache-safe=true' >> "$GITHUB_OUTPUT"
      - name: Save sanitized Android dependencies even after validation failure
        if: ${{ !cancelled() && steps.scrub.outputs.cache-safe == 'true' && steps.release-cache.outputs.cache-primary-key != '' && steps.release-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android/CACHEDIR.TAG
            target/android/release
            target/android/aarch64-linux-android/release
            target/runner
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  publish:
    name: Publish Engine
    needs: [bundle, android]
    if: >-
      always() && !cancelled() && needs.bundle.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tday-*-test
          path: bundles
          merge-multiple: true
      - name: Verify all platform downloads
        shell: bash
        run: |
          shopt -s nullglob
          packages=(bundles/*.zip)
          expected_zips=3
          if [[ "${#packages[@]}" -ne "$expected_zips" ]]; then
            echo "Expected $expected_zips platform packages, found ${#packages[@]}" >&2
            exit 1
          fi
          apks=(bundles/*.apk)
          expected=1
          if [[ "${#apks[@]}" -ne "$expected" ]]; then
            echo "Expected $expected Android packages, found ${#apks[@]}" >&2
            exit 1
          fi
      - name: Move selected rolling tag
        id: release
        shell: bash
        run: |
          git tag --force "$RELEASE_TAG" "$RELEASE_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          echo "short_sha=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Update selected test release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: tday playtest ${{ steps.release.outputs.short_sha }}
          body: |
            Manually requested tday test game. Original story and media copyright shiftz; see the GAME-LICENSE section in NOTICE.

            Source commit: ${{ env.RELEASE_SHA }}.
            Download your platform, extract the complete archive, and run
            `keine.exe` (Windows) or `./keine` (macOS/Linux).
            Android: install tday-android-arm64-test.apk (ARM64, Android 8+); game content is included. Test signing only.
            Temporary test identity; not a formal game update channel.
          prerelease: true
          make_latest: false
          files: bundles/*
          fail_on_unmatched_files: true
          overwrite_files: true
