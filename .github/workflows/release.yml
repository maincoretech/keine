name: encrypted-release

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to package
        required: true
        default: projects/test-project
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: keine-linux
          - os: macos-latest
            artifact: keine-macos
          - os: windows-latest
            artifact: keine-windows
    runs-on: ${{ matrix.os }}
    env:
      KEINE_HEXZ_PASSWORD: ${{ secrets.KEINE_HEXZ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require encrypted-release secret
        shell: bash
        run: |
          if [[ -z "$KEINE_HEXZ_PASSWORD" ]]; then
            echo "Configure the KEINE_HEXZ_PASSWORD repository secret" >&2
            exit 2
          fi
      - name: Detect project media features
        shell: bash
        run: |
          source dev/scripts/audio-features.sh
          features="$(detect_audio_features "${{ inputs.project || 'projects/test-project' }}")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
      - name: Install pinned Hexz CLI
        shell: bash
        run: >-
          cargo install --locked --git https://github.com/maincoretech/hexz_k
          --rev 4cf5287 --no-default-features --features cli
      - name: Build encrypted release package
        shell: bash
        run: >-
          bash dev/scripts/package-release.sh
          "${{ inputs.project || 'projects/test-project' }}"
          "target/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
