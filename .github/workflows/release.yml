name: Release

# Successful main CI updates the rolling benchmark download. Manual production
# bundles still explicitly select the stable identity; automatic builds use no secret.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to bundle
        required: true
        default: tests/fixtures/native-benchmark
      identity:
        description: Publisher identity (temporary for tests; stable for production updates)
        required: true
        type: choice
        options:
          - temporary
          - stable
        default: temporary
      benchmark:
        description: Build a separate self-running performance benchmark package
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' || inputs.benchmark }}
  cancel-in-progress: false

env:
  # workflow_run's github.sha is the default branch tip, not necessarily the
  # commit that passed CI. Use the upstream run's immutable source throughout.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  KEINE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  IDENTITY_MODE: ${{ inputs.identity || 'temporary' }}
  BENCHMARK_PACKAGE: ${{ github.event_name == 'workflow_run' || inputs.benchmark }}

jobs:
  identity:
    name: Resolve publisher identity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable publisher identity
        if: inputs.identity == 'stable'
        shell: bash
        env:
          HAKUTAKU_IDENTITY_BASE64: ${{ secrets.HAKUTAKU_IDENTITY_BASE64 }}
        run: |
          if [[ -z "$HAKUTAKU_IDENTITY_BASE64" ]]; then
            cat >&2 <<'EOF'
          Stable publishing requires the HAKUTAKU_IDENTITY_BASE64 repository secret.

          Generate the identity once on a trusted development machine:
            cargo pack <project>

          The private file is then:
            <project>/.keine/publisher.key

          Base64-encode that file and add the result under:
            Settings > Secrets and variables > Actions > Repository secrets

          For test-project or benchmark bundles, rerun with identity=temporary;
          no secret is required.
          EOF
            exit 2
          fi

  bundle:
    name: ${{ matrix.name }}
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: keine-linux
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: macOS
            os: macos-latest
            artifact: keine-macos
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: Windows x64
            os: windows-latest
            artifact: keine-windows-x64
            target: x86_64-pc-windows-msvc
            engine_target_dir: x86_64-pc-windows-msvc
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    env:
      KEINE_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Resolve project input
        id: project
        shell: bash
        env:
          PROJECT_INPUT: ${{ inputs.project || 'tests/fixtures/native-benchmark' }}
        run: |
          if [[ "$PROJECT_INPUT" == *$'\n'* || "$PROJECT_INPUT" == *$'\r'* ]]; then
            echo 'Project path must not contain line breaks' >&2
            exit 2
          fi
          if [[ ! -d "$PROJECT_INPUT" ]]; then
            echo "Project directory does not exist: $PROJECT_INPUT" >&2
            exit 2
          fi
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          project="$(cd "$PROJECT_INPUT" && pwd -P)"
          case "$project" in
            "$workspace"|"$workspace"/*) ;;
            *)
              echo "Project directory must stay inside the checkout: $project" >&2
              exit 2
              ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"
      - name: Detect canonical shipping features
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          source dev/scripts/shipping-features.sh
          features="$(detect_shipping_features "$PROJECT_PATH")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
      - name: Resolve artifact name
        id: artifact
        shell: bash
        env:
          ARTIFACT_BASE: ${{ matrix.artifact }}
        run: |
          artifact="$ARTIFACT_BASE"
          if [[ "$IDENTITY_MODE" == "temporary" ]]; then
            artifact="${artifact}-temporary"
          fi
          if [[ "$BENCHMARK_PACKAGE" == "true" ]]; then
            artifact="${artifact}-benchmark"
          fi
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - name: Restore Rust release cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Bundle outputs also live under target/, so cache only Cargo's
          # release trees rather than archiving the finished distributions.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/CACHEDIR.TAG
            target/${{ matrix.engine_target_dir }}
            target/${{ matrix.target }}/profiling
            target/runner
          key: release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_FEATURES }}-${{ env.RELEASE_SHA }}
          restore-keys: |
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_FEATURES }}-
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
          windows-triplet: ${{ matrix.triplet }}
      - name: Build publisher runner
        # A separate target dir keeps the running publisher out of the engine
        # rebuild that `keine bundle` performs inside target/release.
        run: cargo build --release --locked --no-default-features --features publisher --target-dir target/runner
      - name: Prepare publisher identity path
        id: publisher_identity
        shell: bash
        run: |
          umask 077
          identity_dir="${RUNNER_TEMP//\\//}/keine-release-secrets"
          mkdir -p "$identity_dir"
          echo "path=$identity_dir/publisher.key" >> "$GITHUB_OUTPUT"
          if [[ "$IDENTITY_MODE" == "temporary" ]]; then
            echo 'Using an isolated temporary publisher identity for this platform bundle'
          fi
      - name: Restore stable publisher identity
        if: inputs.identity == 'stable'
        shell: bash
        env:
          HAKUTAKU_IDENTITY_BASE64: ${{ secrets.HAKUTAKU_IDENTITY_BASE64 }}
          PUBLISHER_IDENTITY_PATH: ${{ steps.publisher_identity.outputs.path }}
        run: |
          umask 077
          printf '%s' "$HAKUTAKU_IDENTITY_BASE64" |
            openssl base64 -d -A -out "$PUBLISHER_IDENTITY_PATH"
      - name: Bundle encrypted release
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          KEINE_HAKUTAKU_IDENTITY: ${{ steps.publisher_identity.outputs.path }}
        run: |
          args=(bundle "$PROJECT_PATH" --output "target/${{ steps.artifact.outputs.name }}")
          if [[ "$BENCHMARK_PACKAGE" == "true" ]]; then
            args+=(--benchmark)
          fi
          target/runner/release/keine "${args[@]}"
      - name: Remove publisher identity
        if: always()
        shell: bash
        env:
          PUBLISHER_IDENTITY_PATH: ${{ steps.publisher_identity.outputs.path }}
        run: rm -f "$PUBLISHER_IDENTITY_PATH"
      - name: Verify Linux runtime closure
        if: runner.os == 'Linux' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: bash
        run: |
          test -x "target/${{ steps.artifact.outputs.name }}/keine"
          test -d "target/${{ steps.artifact.outputs.name }}/lib"
          readelf -d "target/${{ steps.artifact.outputs.name }}/keine" | grep -F '(RPATH)' | grep -F '$ORIGIN/lib'
          if ldd "target/${{ steps.artifact.outputs.name }}/keine" | grep -q 'not found'; then
            echo 'Linux release has unresolved dynamic libraries' >&2
            exit 1
          fi
          (cd /tmp && "$GITHUB_WORKSPACE/target/${{ steps.artifact.outputs.name }}/keine" --version)
      - name: Verify Windows FFmpeg runtime
        if: runner.os == 'Windows' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: pwsh
        run: |
          $root = 'target/${{ steps.artifact.outputs.name }}'
          if (-not (Test-Path (Join-Path $root 'keine.exe'))) { throw 'keine.exe is missing' }
          if (-not (Get-ChildItem $root -Filter '*.dll')) { throw 'FFmpeg runtime DLLs are missing' }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: target/${{ steps.artifact.outputs.name }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove key-bearing compiler outputs before cache save
        if: always()
        shell: bash
        run: |
          # Cache restore and the separate publisher build can create target/
          # before Cargo writes its tag. Cargo 1.97 requires it for explicit clean.
          if [[ -d target && ! -f target/CACHEDIR.TAG ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > target/CACHEDIR.TAG
          fi
          args=(--locked --target-dir target -p keine -p keine-loader)
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          cargo clean "${args[@]}" --profile release
          cargo clean "${args[@]}" --profile profiling

  publish-benchmark:
    name: Publish benchmark release
    if: github.event_name == 'workflow_run' || inputs.benchmark
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: '*-benchmark'
          path: dist
      - name: Create standalone downloads
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*-benchmark)
          if [[ "${#packages[@]}" -ne 3 ]]; then
            echo "Expected three benchmark packages, found ${#packages[@]}" >&2
            exit 1
          fi
          mkdir bundles
          for directory in "${packages[@]}"; do
            name="$(basename "$directory")"
            (cd "$directory" && zip -q -r "$GITHUB_WORKSPACE/bundles/$name.zip" .)
          done
      - name: Move rolling benchmark tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$current_main" != "$RELEASE_SHA" ]]; then
              echo 'A newer main commit exists; keep these artifacts without replacing the rolling download.'
              exit 0
            fi
          fi
          git tag --force benchmark-latest "$RELEASE_SHA"
          git push --force origin refs/tags/benchmark-latest
          echo "short_sha=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Update rolling benchmark release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: benchmark-latest
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Kēne benchmark · ${{ steps.release.outputs.short_sha }}
          body: |
            Automated performance packages built from commit ${{ env.RELEASE_SHA }}.

            Download the package for your platform, extract it, and run
            `keine.exe` on Windows or `keine` on macOS/Linux. The report is
            written beside the executable.
          prerelease: true
          files: bundles/*-benchmark.zip
          fail_on_unmatched_files: true
          overwrite_files: true
