name: Release

# Release is manual-only. The archive password comes from the repository's
# HEXZ_PASSWORD secret so GitHub can mask it in logs.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to package
        required: true
        default: projects/test-project

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: keine-linux
            target: ''
            triplet: x64-windows
          - name: macOS
            os: macos-latest
            artifact: keine-macos
            target: ''
            triplet: x64-windows
          - name: Windows x64
            os: windows-latest
            artifact: keine-windows-x64
            target: x86_64-pc-windows-msvc
            triplet: x64-windows
          - name: Windows ARM64
            os: windows-latest
            artifact: keine-windows-arm64
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows
    runs-on: ${{ matrix.os }}
    env:
      HEXZ_PASSWORD: ${{ secrets.HEXZ_PASSWORD }}
      KEINE_BUILD_TARGET: ${{ matrix.target }}
      # Ignored unless the ARM64 target is built. ring 0.16 requires clang-cl
      # rather than MSVC cl.exe for its Windows ARM64 C implementation.
      CC_aarch64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Require encrypted-release secret
        shell: bash
        run: |
          if [[ -z "$HEXZ_PASSWORD" ]]; then
            echo "Configure the HEXZ_PASSWORD repository secret" >&2
            exit 2
          fi
      - name: Detect project media features
        shell: bash
        run: |
          source dev/scripts/audio-features.sh
          features="$(detect_audio_features "${{ inputs.project }}")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
          windows-triplet: ${{ matrix.triplet }}
      - name: Build package runner
        # A separate target dir keeps the running runner out of the engine
        # rebuild that `keine package` performs inside target/release.
        run: cargo build --release --locked --no-default-features --target-dir target/runner
      - name: Package encrypted release
        shell: bash
        run: >-
          target/runner/release/keine package
          "${{ inputs.project }}"
          --output target/${{ matrix.artifact }}
      - name: Verify Linux runtime closure
        if: runner.os == 'Linux' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: bash
        run: |
          test -x "target/${{ matrix.artifact }}/keine"
          test -d "target/${{ matrix.artifact }}/lib"
          if LD_LIBRARY_PATH="target/${{ matrix.artifact }}/lib" ldd "target/${{ matrix.artifact }}/keine" | grep -q 'not found'; then
            echo 'Linux release has unresolved dynamic libraries' >&2
            exit 1
          fi
      - name: Verify Windows FFmpeg runtime
        if: runner.os == 'Windows' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: pwsh
        run: |
          $root = 'target/${{ matrix.artifact }}'
          if (-not (Test-Path (Join-Path $root 'keine.exe'))) { throw 'keine.exe is missing' }
          if (-not (Get-ChildItem $root -Filter '*.dll')) { throw 'FFmpeg runtime DLLs are missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
