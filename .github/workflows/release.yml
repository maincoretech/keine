name: Release

# Main CI publishes benchmarks automatically; tday is an explicit manual choice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (tday is never automatic)
        required: true
        type: choice
        options: [benchmark, tday]
        default: benchmark

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.package || 'benchmark' }}
  cancel-in-progress: false

env:
  # workflow_run's github.sha is the default branch tip, not necessarily the
  # commit that passed CI. Use the upstream run's immutable source throughout.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  KEINE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  BENCHMARK_PACKAGE: ${{ github.event_name == 'workflow_run' || inputs.package == 'benchmark' }}
  RELEASE_TAG: ${{ inputs.package == 'tday' && 'tday-latest' || 'benchmark-latest' }}

jobs:
  source:
    name: Select trusted source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Test packages use an isolated temporary publisher identity.'

  bundle:
    name: ${{ matrix.name }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: keine-linux
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: macOS
            os: macos-latest
            artifact: keine-macos
            target: ''
            engine_target_dir: release
            triplet: x64-windows
          - name: Windows x64
            os: windows-latest
            artifact: keine-windows-x64
            target: x86_64-pc-windows-msvc
            engine_target_dir: x86_64-pc-windows-msvc
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    env:
      KEINE_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Resolve project input
        id: project
        shell: bash
        env:
          PROJECT_INPUT: ${{ inputs.package == 'tday' && 'projects/tday' || 'tests/fixtures/native-benchmark' }}
        run: |
          if [[ "$PROJECT_INPUT" == *$'\n'* || "$PROJECT_INPUT" == *$'\r'* ]]; then
            echo 'Project path must not contain line breaks' >&2
            exit 2
          fi
          if [[ ! -d "$PROJECT_INPUT" ]]; then
            echo "Project directory does not exist: $PROJECT_INPUT" >&2
            exit 2
          fi
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          project="$(cd "$PROJECT_INPUT" && pwd -P)"
          case "$project" in
            "$workspace"|"$workspace"/*) ;;
            *)
              echo "Project directory must stay inside the checkout: $project" >&2
              exit 2
              ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"
      - name: Detect canonical shipping features
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          source dev/scripts/shipping-features.sh
          features="$(detect_shipping_features "$PROJECT_PATH")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
          # Cargo uses commas; Actions cache keys forbid them.
          echo "KEINE_RELEASE_CACHE_FEATURES=${features//,/-}" >> "$GITHUB_ENV"
      - name: Resolve artifact name
        id: artifact
        shell: bash
        env:
          ARTIFACT_BASE: ${{ matrix.artifact }}
        run: |
          if [[ "$BENCHMARK_PACKAGE" == "true" ]]; then
            artifact="${ARTIFACT_BASE}-temporary-benchmark"
          else
            artifact="tday-${ARTIFACT_BASE#keine-}-test"
          fi
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - name: Restore Rust release cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Bundle outputs also live under target/, so cache only Cargo's
          # release trees rather than archiving the finished distributions.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/CACHEDIR.TAG
            target/${{ matrix.engine_target_dir }}
            target/${{ matrix.target }}/profiling
            target/runner
          key: release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_CACHE_FEATURES }}-${{ env.RELEASE_SHA }}
          restore-keys: |
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.KEINE_RELEASE_CACHE_FEATURES }}-
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            release-rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
          windows-triplet: ${{ matrix.triplet }}
      - name: Build publisher runner
        # A separate target dir keeps the running publisher out of the engine
        # rebuild that `keine bundle` performs inside target/release.
        run: cargo build --release --locked --no-default-features --features publisher --target-dir target/runner
      - name: Prepare publisher identity path
        id: publisher_identity
        shell: bash
        run: |
          umask 077
          identity_dir="${RUNNER_TEMP//\\//}/keine-release-secrets"
          mkdir -p "$identity_dir"
          echo "path=$identity_dir/publisher.key" >> "$GITHUB_OUTPUT"
          echo 'Using an isolated temporary publisher identity for this platform bundle'
      - name: Bundle encrypted release
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
          KEINE_HAKUTAKU_IDENTITY: ${{ steps.publisher_identity.outputs.path }}
        run: |
          args=(bundle "$PROJECT_PATH" --output "target/${{ steps.artifact.outputs.name }}")
          if [[ "$BENCHMARK_PACKAGE" == "true" ]]; then
            args+=(--benchmark)
          fi
          target/runner/release/keine "${args[@]}"
      - name: Include demo copyright notice
        if: inputs.package == 'tday'
        shell: bash
        run: cp projects/tday/LICENSE "target/${{ steps.artifact.outputs.name }}/TDAY-LICENSE"
      - name: Remove publisher identity
        if: always()
        shell: bash
        env:
          PUBLISHER_IDENTITY_PATH: ${{ steps.publisher_identity.outputs.path }}
        run: rm -f "$PUBLISHER_IDENTITY_PATH"
      - name: Verify Linux runtime closure
        if: runner.os == 'Linux' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: bash
        run: |
          test -x "target/${{ steps.artifact.outputs.name }}/keine"
          test -d "target/${{ steps.artifact.outputs.name }}/lib"
          readelf -d "target/${{ steps.artifact.outputs.name }}/keine" | grep -F '(RPATH)' | grep -F '$ORIGIN/lib'
          if ldd "target/${{ steps.artifact.outputs.name }}/keine" | grep -q 'not found'; then
            echo 'Linux release has unresolved dynamic libraries' >&2
            exit 1
          fi
          (cd /tmp && "$GITHUB_WORKSPACE/target/${{ steps.artifact.outputs.name }}/keine" --version)
      - name: Verify Windows FFmpeg runtime
        if: runner.os == 'Windows' && contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg')
        shell: pwsh
        run: |
          $root = 'target/${{ steps.artifact.outputs.name }}'
          if (-not (Test-Path (Join-Path $root 'keine.exe'))) { throw 'keine.exe is missing' }
          if (-not (Get-ChildItem $root -Filter '*.dll')) { throw 'FFmpeg runtime DLLs are missing' }
      - name: Archive executable permissions before artifact upload
        shell: bash
        run: |
          mkdir -p bundles
          python3 - <<'PYTHON'
          import shutil
          shutil.make_archive('bundles/${{ steps.artifact.outputs.name }}', 'zip', 'target/${{ steps.artifact.outputs.name }}')
          PYTHON
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: bundles/${{ steps.artifact.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Remove key-bearing compiler outputs before cache save
        if: always()
        shell: bash
        run: |
          # Cache restore and the separate publisher build can create target/
          # before Cargo writes its tag. Cargo 1.97 requires it for explicit clean.
          if [[ -d target && ! -f target/CACHEDIR.TAG ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > target/CACHEDIR.TAG
          fi
          args=(--locked --target-dir target -p keine -p keine-loader)
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          cargo clean "${args[@]}" --profile release
          cargo clean "${args[@]}" --profile profiling

  publish:
    name: Publish selected test release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ${{ inputs.package == 'tday' && 'tday-*-test' || '*-benchmark' }}
          path: bundles
          merge-multiple: true
      - name: Verify all platform downloads
        shell: bash
        run: |
          shopt -s nullglob
          packages=(bundles/*.zip)
          if [[ "${#packages[@]}" -ne 3 ]]; then
            echo "Expected three platform packages, found ${#packages[@]}" >&2
            exit 1
          fi
      - name: Move selected rolling tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$current_main" != "$RELEASE_SHA" ]]; then
              echo 'A newer main commit exists; keep these artifacts without replacing the rolling download.'
              exit 0
            fi
          fi
          git tag --force "$RELEASE_TAG" "$RELEASE_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          echo "short_sha=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Update selected test release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_SHA }}
          name: ${{ inputs.package == 'tday' && 'tday playtest' || 'Kēne benchmark' }} · ${{ steps.release.outputs.short_sha }}
          body: |
            ${{ inputs.package == 'tday' && 'Manually requested tday test game. Original story and media copyright shiftz; see TDAY-LICENSE in the download.' || 'Automated performance suite. Run the executable; the benchmark report is written beside it.' }}

            Source commit: ${{ env.RELEASE_SHA }}.
            Download your platform, extract the complete archive, and run
            `keine.exe` (Windows) or `./keine` (macOS/Linux).
            Temporary test identity; not a formal game update channel.
          prerelease: true
          make_latest: false
          files: bundles/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
