name: encrypted-release

# Release is manual-only. The archive password comes from the repository's
# HEXZ_PASSWORD secret so GitHub can mask it in logs.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project directory to package
        required: true
        default: projects/test-project

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: keine-linux
          - os: macos-latest
            artifact: keine-macos
          - os: windows-latest
            artifact: keine-windows
    runs-on: ${{ matrix.os }}
    env:
      HEXZ_PASSWORD: ${{ secrets.HEXZ_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Require encrypted-release secret
        shell: bash
        run: |
          if [[ -z "$HEXZ_PASSWORD" ]]; then
            echo "Configure the HEXZ_PASSWORD repository secret" >&2
            exit 2
          fi
      - name: Detect project media features
        shell: bash
        run: |
          source dev/scripts/audio-features.sh
          features="$(detect_audio_features "${{ inputs.project }}")"
          echo "KEINE_RELEASE_FEATURES=$features" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ contains(env.KEINE_RELEASE_FEATURES, 'video-ffmpeg') }}
      - name: Build package runner
        # A separate target dir keeps the running runner out of the engine
        # rebuild that `keine package` performs inside target/release.
        run: cargo build --release --locked --no-default-features --target-dir target/runner
      - name: Package encrypted release
        shell: bash
        run: >-
          target/runner/release/keine package
          "${{ inputs.project }}"
          --output target/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
