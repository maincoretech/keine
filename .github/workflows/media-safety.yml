name: Media safety

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/media/**"
      - "fuzz/**"
      - "src/scene/images.rs"
      - "src/scene/video.rs"
      - "src/scene/video/**"
      - ".github/actions/setup-video/**"
      - ".github/workflows/media-safety.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/media/**"
      - "fuzz/**"
      - "src/scene/images.rs"
      - "src/scene/video.rs"
      - "src/scene/video/**"
      - ".github/actions/setup-video/**"
      - ".github/workflows/media-safety.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webp-fuzz:
    name: WebP libFuzzer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - uses: ./.github/actions/setup-video
        with:
          enabled: "false"
      - name: Cache cargo-fuzz
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Install cargo-fuzz
        shell: bash
        run: |
          echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
          cargo install --locked --root "${{ runner.tool_cache }}/cargo-fuzz" --version "$CARGO_FUZZ_VERSION" cargo-fuzz
      - name: Fuzz the production WebP decoder
        run: >-
          cargo +nightly fuzz run webp_decode fuzz/corpus/webp_decode
          projects/test-project/assets/backgrounds --
          -max_total_time=60 -max_len=4194304 -rss_limit_mb=2048
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: webp-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  ffmpeg-asan:
    name: Linux FFmpeg ASan acceptance
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install nightly Rust and rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: ./.github/actions/setup-video
        with:
          enabled: "true"
      - name: Resolve sanitizer target
        shell: bash
        run: |
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          test -n "$host"
          echo "RUST_HOST=$host" >> "$GITHUB_ENV"
      - name: Exercise filesystem and Hakutaku media under ASan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: |
          cargo_args=(
            +nightly run -Zbuild-std --target "$RUST_HOST" --locked
            --no-default-features --features publisher,video-ffmpeg
            --bin keine-video-acceptance --
          )
          for fixture in playback.mp4 no-audio.mp4 long-gop.mp4 tail-moov.mp4; do
            cargo "${cargo_args[@]}" "dev/fixtures/video/$fixture"
          done
          cargo "${cargo_args[@]}" --expect-error dev/fixtures/video/damaged-header.mp4
