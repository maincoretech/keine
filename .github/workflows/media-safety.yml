name: CI Media Safety

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/media/**"
      - "tests/fuzz/**"
      - "src/scene/images.rs"
      - "src/scene/video.rs"
      - "src/scene/video/**"
      - ".github/actions/setup-video/**"
      - ".github/workflows/media-safety.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/media/**"
      - "tests/fuzz/**"
      - "src/scene/images.rs"
      - "src/scene/video.rs"
      - "src/scene/video/**"
      - ".github/actions/setup-video/**"
      - ".github/workflows/media-safety.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: Media safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webp-fuzz:
    name: Check WebP Fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - name: Add cargo-fuzz to PATH
        shell: bash
        run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --locked --root "${{ runner.tool_cache }}/cargo-fuzz" --version "$CARGO_FUZZ_VERSION" cargo-fuzz
      - name: Fuzz the production WebP decoder
        run: >-
          cargo +nightly fuzz run --fuzz-dir tests/fuzz webp tests/fuzz/corpus/webp
          tests/fixtures/letsgal-timeline/assets/backgrounds/calibration --
          -max_total_time=60 -max_len=4194304 -rss_limit_mb=2048
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webp-fuzz-artifacts-${{ github.sha }}
          path: tests/fuzz/artifacts/
          if-no-files-found: ignore

  ffmpeg-asan:
    name: Check FFmpeg ASan
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust and rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: "true"
      - name: Resolve sanitizer target
        shell: bash
        run: |
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          test -n "$host"
          echo "RUST_HOST=$host" >> "$GITHUB_ENV"
      - name: Exercise filesystem and Hakutaku media under ASan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: |
          cargo_args=(
            +nightly run -Zbuild-std --target "$RUST_HOST" --locked
            --no-default-features --features publisher,video-ffmpeg
            --bin keine-video-acceptance --
          )
          for fixture in playback.mp4 no-audio.mp4 long-gop.mp4 tail-moov.mp4; do
            cargo "${cargo_args[@]}" "tests/fixtures/video/$fixture"
          done
          cargo "${cargo_args[@]}" --expect-error tests/fixtures/video/damaged-header.mp4
