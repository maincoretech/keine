name: Release Editor

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}
  KEINE_BUILD_COMMIT: ${{ github.sha }}

jobs:
  dependencies:
    name: Check Dependencies
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      current: ${{ steps.current.outputs.build }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Skip superseded automatic release before compiling
        id: current
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$(git ls-remote origin refs/heads/main | cut -f1)" != "$RELEASE_SHA" ]]; then
            echo 'Newer main exists; skip this automatic release.'
            exit 0
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.current.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - name: Check dependencies
        if: steps.current.outputs.build == 'true'
        uses: ./.github/actions/check-dependencies

  build:
    needs: dependencies
    if: needs.dependencies.outputs.current == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux x64, macOS arm64, Windows x64]
    runs-on: ${{ matrix.platform == 'Linux x64' && 'ubuntu-24.04' || matrix.platform == 'macOS arm64' && 'macos-26' || 'windows-2025' }}
    env:
      RUNNER_IMAGE: ${{ matrix.platform == 'Linux x64' && 'ubuntu-24.04' || matrix.platform == 'macOS arm64' && 'macos-26' || 'windows-2025' }}
      BUILD_TARGET: ${{ matrix.platform == 'Windows x64' && 'x86_64-pc-windows-msvc' || '' }}
      ARTIFACT: ${{ matrix.platform == 'Linux x64' && 'keine-editor-linux-x64' || matrix.platform == 'macOS arm64' && 'keine-editor-macos-arm64' || 'keine-editor-windows-x64' }}
      KEINE_AUTHORING_FEATURES: ${{ matrix.platform == 'macOS arm64' && 'audio-all,ui-sounds,hot-reload,video-native' || 'audio-all,ui-sounds,hot-reload,video-ffmpeg' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - name: Install cross-compilation target
        if: env.BUILD_TARGET != ''
        run: rustup target add ${{ env.BUILD_TARGET }}
      - name: Restore build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Separate from encrypted game caches; no publisher/hardened build.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/authoring
            target/icon-tool
          key: editor-rust-v1-${{ env.RUNNER_IMAGE }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            editor-rust-v1-${{ env.RUNNER_IMAGE }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            editor-rust-v1-${{ env.RUNNER_IMAGE }}-${{ runner.arch }}-
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: ${{ runner.os != 'macOS' }}
          windows-triplet: x64-windows
      - name: Build standalone authoring tools
        shell: bash
        run: |
          cargo run --locked -p keine-media --features icons --example icons --target-dir target/icon-tool -- src/assets/icons/keine.png target/editor-icons
          python3 dev/scripts/verify-icons.py --icon-dir target/editor-icons
          export KEINE_APP_ICON_DIR="$GITHUB_WORKSPACE/target/editor-icons"
          echo "KEINE_APP_ICON_DIR=$KEINE_APP_ICON_DIR" >> "$GITHUB_ENV"
          args=(--release --locked --no-default-features --features "$KEINE_AUTHORING_FEATURES"
                --target-dir target/authoring -p keine -p keine-editor --bin keine --bin editor)
          if [[ -n "$BUILD_TARGET" ]]; then
            args+=(--target "$BUILD_TARGET")
          fi
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            export RUSTFLAGS='-C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib'
          fi
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            export KEINE_WINDOWS_BUNDLE=1
          fi
          cargo build "${args[@]}"
      - name: Package and validate installed runtime
        shell: bash
        run: |
          binary_dir="target/authoring/${BUILD_TARGET:+$BUILD_TARGET/}release"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python3 dev/scripts/package-authoring.py "$binary_dir/editor$suffix" "$binary_dir/keine$suffix" "target/${{ env.ARTIFACT }}"
      - name: Archive complete package
        shell: bash
        run: |
          mkdir -p downloads
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            ditto -c -k --keepParent "target/${{ env.ARTIFACT }}" "downloads/${{ env.ARTIFACT }}.zip"
          else
            python3 - <<'PY'
          import shutil
          shutil.make_archive('downloads/${{ env.ARTIFACT }}', 'zip', 'target/${{ env.ARTIFACT }}')
          PY
          fi
      - name: Verify final Linux archive
        if: runner.os == 'Linux'
        uses: ./.github/actions/verify-linux-package
        with:
          package: downloads/${{ env.ARTIFACT }}.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: downloads/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save authoring dependencies even after validation failure
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/authoring
            target/icon-tool
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  publish:
    name: Publish Editor
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: keine-editor-*
          path: downloads
          merge-multiple: true
      - name: Move Editor rolling tag
        id: release
        shell: bash
        run: |
          shopt -s nullglob
          packages=(downloads/keine-editor-*.zip)
          [[ "${#packages[@]}" -eq 3 ]] || { echo 'Expected three Editor downloads' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$current_main" != "$RELEASE_SHA" ]]; then
              echo 'Newer main exists; retain artifacts without replacing editor-latest.'
              exit 0
            fi
          fi
          git tag --force editor-latest "$RELEASE_SHA"
          git push --force origin refs/tags/editor-latest
          echo "short_sha=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publish Editor release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.release.outputs.publish == 'true'
        with:
          tag_name: editor-latest
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Kēne Editor ${{ steps.release.outputs.short_sha }}
          body: |
            Standalone Editor with the matching Preview Engine, built from ${{ env.RELEASE_SHA }}.
            Download and extract the complete package. Open Kēne Editor.app (macOS),
            editor.exe (Windows) or ./editor (Linux). No game content or publisher keys.
            macOS download is Apple Silicon with an ad hoc development signature.
            Noncanonical audio/video conversion requires an external FFmpeg executable.
          prerelease: true
          make_latest: false
          files: downloads/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
