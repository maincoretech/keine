name: Release Editor

on:
  workflow_run:
    workflows: ["CI Desktop"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  KEINE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: keine-editor-linux-x64
            target: ''
            features: audio-all,ui-sounds,hot-reload,video-ffmpeg
          - name: macOS arm64
            os: macos-26
            artifact: keine-editor-macos-arm64
            target: ''
            features: audio-all,ui-sounds,hot-reload,video-native
          - name: Windows x64
            os: windows-2025
            artifact: keine-editor-windows-x64
            target: x86_64-pc-windows-msvc
            features: audio-all,ui-sounds,hot-reload,video-ffmpeg
    runs-on: ${{ matrix.os }}
    env:
      KEINE_AUTHORING_FEATURES: ${{ matrix.features }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Separate from encrypted game caches; no publisher/hardened build.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/authoring
          key: editor-rust-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ env.RELEASE_SHA }}
          restore-keys: |
            editor-rust-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            editor-rust-v1-${{ matrix.os }}-${{ runner.arch }}-
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: ${{ runner.os != 'macOS' }}
          windows-triplet: x64-windows
      - name: Build standalone authoring tools
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 dev/scripts/build-icons.py target/editor-icons
          python3 dev/scripts/verify-icons.py --icon-dir target/editor-icons
          export KEINE_APP_ICON_DIR="$GITHUB_WORKSPACE/target/editor-icons"
          echo "KEINE_APP_ICON_DIR=$KEINE_APP_ICON_DIR" >> "$GITHUB_ENV"
          args=(--release --locked --no-default-features --features "$KEINE_AUTHORING_FEATURES"
                --target-dir target/authoring -p keine -p keine-editor --bin keine --bin editor)
          if [[ -n "$BUILD_TARGET" ]]; then
            args+=(--target "$BUILD_TARGET")
          fi
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            export RUSTFLAGS='-C link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/lib'
          fi
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            export KEINE_WINDOWS_BUNDLE=1
          fi
          cargo build "${args[@]}"
      - name: Package and validate installed runtime
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          binary_dir="target/authoring/${BUILD_TARGET:+$BUILD_TARGET/}release"
          suffix=''
          if [[ "$RUNNER_OS" == 'Windows' ]]; then suffix='.exe'; fi
          python3 dev/scripts/package-authoring.py "$binary_dir/editor$suffix" "$binary_dir/keine$suffix" "target/${{ matrix.artifact }}"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            python3 dev/scripts/verify-linux-abi.py "target/${{ matrix.artifact }}"
          fi
      - name: Archive complete package
        shell: bash
        run: |
          mkdir -p downloads
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            ditto -c -k --keepParent "target/${{ matrix.artifact }}" "downloads/${{ matrix.artifact }}.zip"
          else
            python3 - <<'PY'
          import shutil
          shutil.make_archive('downloads/${{ matrix.artifact }}', 'zip', 'target/${{ matrix.artifact }}')
          PY
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: downloads/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Editor
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: keine-editor-*
          path: downloads
          merge-multiple: true
      - name: Move Editor rolling tag
        id: release
        shell: bash
        run: |
          shopt -s nullglob
          packages=(downloads/keine-editor-*.zip)
          [[ "${#packages[@]}" -eq 3 ]] || { echo 'Expected three Editor downloads' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$current_main" != "$RELEASE_SHA" ]]; then
              echo 'Newer main exists; retain artifacts without replacing editor-latest.'
              exit 0
            fi
          fi
          git tag --force editor-latest "$RELEASE_SHA"
          git push --force origin refs/tags/editor-latest
          echo "short_sha=${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publish Editor release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.release.outputs.publish == 'true'
        with:
          tag_name: editor-latest
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Kēne Editor ${{ steps.release.outputs.short_sha }}
          body: |
            Standalone Editor with the matching Preview Engine, built from ${{ env.RELEASE_SHA }}.
            Download and extract the complete package. Open Kēne Editor.app (macOS),
            editor.exe (Windows) or ./editor (Linux). No game content or publisher keys.
            macOS download is Apple Silicon with an ad hoc development signature.
            Noncanonical audio/video conversion requires an external FFmpeg executable.
          prerelease: true
          make_latest: false
          files: downloads/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
