name: CI Desktop

on:
  push:
    paths-ignore: ['dev/docs/**', 'README.md', 'AGENTS.md', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['dev/docs/**', 'README.md', 'AGENTS.md', '.github/dependabot.yml']

concurrency:
  group: CI-${{ github.ref }}
  # Let main finish and save its cold build; superseded PR/branch runs can stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Assertions remain enabled; full debug symbols do not help deterministic CI tests.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  dependencies:
    name: Check Dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catch packaging regressions before any native Rust compilation.
      - name: Check packaging contracts
        run: |
          python3 dev/scripts/verify-icons.py
          python3 -m unittest discover -s tests/packaging -p 'test_*.py'
      - name: Install pinned official workflow linter
        run: |
          # install-action does not support actionlint; use the upstream binary.
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Check workflow syntax before native compilation
        run: |
          printf 'self-hosted-runner:\n  labels: [ubuntu-26.04]\n' > "$RUNNER_TEMP/actionlint.yaml"
          workflows=(.github/workflows/*.yml)
          # 1.7.12 predates these three documented reusable-workflow job fields.
          # Keep this a workflow syntax/expression gate, independent of runner linters.
          actionlint -shellcheck= -pyflakes= -config-file "$RUNNER_TEMP/actionlint.yaml" \
            -ignore 'property "workflow_(ref|repository|sha)" is not defined in object type' "${workflows[@]}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - name: Check dependencies
        uses: ./.github/actions/check-dependencies

  rust:
    name: Check ${{ matrix.name }}
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            quality: true
            backend: ffmpeg
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-ffmpeg
            shipping_features: ui-sounds,video-ffmpeg
            timeout: 60
          - name: macOS arm64
            os: macos-26
            quality: false
            backend: native
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-native
            shipping_features: ui-sounds,video-native
            timeout: 60
          - name: Windows x64
            os: windows-2025
            quality: false
            backend: ffmpeg
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-ffmpeg
            shipping_features: ui-sounds,video-ffmpeg
            timeout: 180
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: rustfmt, clippy
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/icon-tool
          key: rust-v2-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-v2-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            rust-v2-${{ matrix.os }}-${{ runner.arch }}-
      - name: Set up video dependencies
        uses: ./.github/actions/setup-video
        with:
          enabled: ${{ matrix.backend == 'ffmpeg' }}
      - name: Guard Linux window and renderer features
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i winit > "$RUNNER_TEMP/winit-features.txt"
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i wgpu > "$RUNNER_TEMP/wgpu-features.txt"
          for feature in x11 wayland; do
            grep -E "(^|[[:space:]])winit feature \"$feature\"" "$RUNNER_TEMP/winit-features.txt"
          done
          for feature in vulkan gles; do
            grep -E "(^|[[:space:]])wgpu feature \"$feature\"" "$RUNNER_TEMP/wgpu-features.txt"
          done
      - name: Guard Windows renderer features
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i wgpu > "$RUNNER_TEMP/wgpu-features.txt"
          for feature in dx12 vulkan gles; do
            grep -E "(^|[[:space:]])wgpu feature \"$feature\"" "$RUNNER_TEMP/wgpu-features.txt"
          done
      - name: Check formatting
        if: matrix.quality
        run: cargo fmt --all -- --check
      - name: Check Clippy
        if: matrix.quality
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Check workspace tests
        if: matrix.quality
        run: cargo test --workspace --locked --all-features
      - name: Check publisher pipeline
        if: matrix.quality
        run: cargo test --workspace --locked --no-default-features --features publisher
      # Select Engine and Editor together to unify their Bevy dev-dependencies.
      # libtest accepts several filters; Linux's workspace tests cover these too.
      - name: Check platform video, process metrics, files and instance locks
        run: >-
          cargo test --locked -p keine -p keine-editor --lib --no-default-features
          --features "${{ matrix.test_features }}" --
          scene::video:: preview::performance:: file_ops::assets::
          publisher::tests::native_release_ instance_lock_is_released_with_its_guard
          workspace::document:: workspace::persistence::
          workspace::tests:: resource_migration::tests::replacement_
      - name: Check Editor instance forwarding
        if: ${{ !matrix.quality }}
        run: cargo test --locked -p keine-editor --test instance
      - name: Check native display connection ownership
        run: cargo test --locked -p bevy_render --lib renderer::display_tests
      - name: Check platform video acceptance
        run: >-
          cargo run --locked --no-default-features --features "${{ matrix.test_features }}"
          --bin keine-video-acceptance -- tests/fixtures/video/playback.mp4
      # Keep the native test boundary without rodio; developer audio above must
      # not hide accidental audio references in otherwise audio-free tests.
      - name: Check native video tests without audio
        if: matrix.backend == 'native'
        run: cargo check --locked -p keine --tests --no-default-features --features video-native
      # Optimized linking/packaging belongs to Release and Project Release.
      # Platform tests above still link developer formats; check shipping separately.
      - name: Check canonical shipping feature set
        run: >-
          cargo check --locked --no-default-features
          --features "${{ matrix.shipping_features }}"
      - name: Save Rust build cache even after a test failure
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/icon-tool
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
