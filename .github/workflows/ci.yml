name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check RustSec advisories and yanked dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories

  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            quality: true
            backend: none
            release_features: audio-all,ui-sounds
            timeout: 60
          - name: macOS
            os: macos-latest
            quality: false
            backend: native
            release_features: audio-all,ui-sounds,video-native
            timeout: 60
          - name: Windows x64
            os: windows-latest
            quality: false
            backend: ffmpeg
            release_features: audio-all,ui-sounds,video-ffmpeg
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ matrix.backend == 'ffmpeg' }}
      - if: matrix.quality
        run: cargo fmt --all -- --check
      - if: matrix.quality
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.quality
        run: cargo test --workspace
      - name: Check publisher pipeline
        if: matrix.quality
        run: cargo test --workspace --no-default-features --features publisher
      - name: Check FFmpeg video unit contracts
        if: matrix.backend == 'ffmpeg'
        run: >-
          cargo test -p keine --no-default-features --features publisher,video-ffmpeg
          scene::video::ffmpeg_backend::tests
      - name: Check FFmpeg video acceptance
        if: matrix.backend == 'ffmpeg'
        run: >-
          cargo run --locked --no-default-features --features publisher,video-ffmpeg
          --bin keine-video-acceptance -- dev/fixtures/video/playback.mp4
      - name: Check native video unit contracts
        if: matrix.backend == 'native'
        run: >-
          cargo test -p keine --no-default-features --features video-native
          scene::video::
      - name: Check AVFoundation video acceptance
        if: matrix.backend == 'native'
        run: >-
          cargo run --locked --no-default-features --features publisher,video-native
          --bin keine-video-acceptance -- dev/fixtures/video/playback.mp4
      - name: Build platform release backend
        run: >-
          cargo build --release --locked --no-default-features
          --features "${{ matrix.release_features }}"
