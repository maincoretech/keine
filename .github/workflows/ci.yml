name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-video
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check typed video backend
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: cargo test --workspace --no-default-features --features video-ffmpeg decodes_encrypted_hexz_video_through_random_access
      - name: Check AVFoundation video backend
        if: runner.os == 'macOS'
        run: >-
          cargo run --locked --no-default-features --features video-native
          --bin keine-video-acceptance -- dev/fixtures/video/playback.mp4
      - run: cargo build --release

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    # The transitive ring 0.16 C sources require clang-cl for Windows ARM64;
    # MSVC cl.exe cannot compile their 64-bit limb implementation.
    # https://github.com/rust-lang/cc-rs/issues/882
    env:
      CC_aarch64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - name: Install Windows ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc
      - uses: ./.github/actions/setup-video
        with:
          windows-triplet: arm64-windows
      - name: Check Windows ARM64 video backend
        run: cargo check --workspace --target aarch64-pc-windows-msvc --no-default-features --features video-ffmpeg
