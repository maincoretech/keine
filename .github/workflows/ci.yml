name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android Engine APK
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main finish and save its cold build; superseded PR/branch runs can stop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: Android ARM64 Engine (no video)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@41ad77ca97e46ee2e825d5e6b9a95d8169fcc44c # v4.4.2
        with:
          gradle-version: '8.11.1'
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install pinned cargo-ndk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-ndk@4.1.2
          fallback: none
      - name: Restore Android Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/android
          key: android-arm64-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            android-arm64-ndk28-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Guard Android runtime dependencies
        run: |
          cargo tree --locked -p keine --target aarch64-linux-android \
            --no-default-features --features ui-sounds -e normal,build --prefix none \
            > "$RUNNER_TEMP/android-dependencies.txt"
          if grep -E '^(keine-editor|gpui|rfd|ffmpeg-next) ' "$RUNNER_TEMP/android-dependencies.txt"; then
            echo 'Android Engine must not include Editor, desktop file dialogs or FFmpeg.'
            exit 1
          fi
          cargo tree --locked -p keine --target aarch64-linux-android \
            --no-default-features --features ui-sounds -e features -i wgpu \
            > "$RUNNER_TEMP/android-render-features.txt"
          for backend in vulkan gles; do
            grep -F "wgpu feature \"$backend\"" "$RUNNER_TEMP/android-render-features.txt"
          done
      - name: Build Android Engine and test APK
        run: |
          cargo ndk -t arm64-v8a -P 26 clippy --locked -p keine --lib \
            --target-dir target/android --no-default-features --features ui-sounds -- -D warnings
          dev/scripts/build-android.sh
      - name: Verify native entry point and 16 KB alignment
        run: |
          library=target/android/jniLibs/arm64-v8a/libkeine.so
          readelf --dyn-syms --wide "$library" | grep ' ANativeActivity_onCreate$'
          python3 - <<'PY'
          import subprocess
          library = 'target/android/jniLibs/arm64-v8a/libkeine.so'
          headers = subprocess.check_output(['readelf', '-lW', library], text=True)
          loads = [line.split() for line in headers.splitlines() if line.strip().startswith('LOAD ')]
          assert loads and all(int(line[-1], 16) >= 16384 for line in loads), headers
          relro = [line.split() for line in headers.splitlines() if line.strip().startswith('GNU_RELRO ')]
          assert all((int(line[2], 16) + int(line[5], 16)) % 16384 == 0 for line in relro), headers
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 \
            dev/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            dev/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging \
            dev/android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/android-apk-manifest.txt"
          grep -F "uses-gl-es: '0x30000'" "$RUNNER_TEMP/android-apk-manifest.txt"
          grep -F "uses-feature-not-required: name='android.hardware.vulkan.level'" \
            "$RUNNER_TEMP/android-apk-manifest.txt"
      - name: Upload Android Engine artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keine-android-arm64-engine
          if-no-files-found: error
          path: |
            dev/android/app/build/outputs/apk/debug/app-debug.apk
            target/android/jniLibs/arm64-v8a/libkeine.so
            target/android/notices/

  dependencies:
    if: github.event_name != 'workflow_dispatch' || !inputs.android_only
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Use the runner's GNU host; the Alpine action redownloads our pinned
      # toolchain as musl Rust inside its separate container.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Check advisories, licenses, dependency versions and sources
        run: cargo deny --locked --all-features check advisories licenses bans sources

  rust:
    if: github.event_name != 'workflow_dispatch' || !inputs.android_only
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            quality: true
            backend: ffmpeg
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-ffmpeg
            shipping_features: ui-sounds,video-ffmpeg
            timeout: 60
          - name: macOS
            os: macos-latest
            quality: false
            backend: native
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-native
            shipping_features: ui-sounds,video-native
            timeout: 60
          - name: Windows x64
            os: windows-latest
            quality: false
            backend: ffmpeg
            test_features: audio-all,ui-sounds,publisher,startup-metrics,video-ffmpeg
            shipping_features: ui-sounds,video-ffmpeg
            timeout: 180
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
            rust-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-video
        with:
          enabled: ${{ matrix.backend == 'ffmpeg' }}
      - name: Guard Linux window and renderer features
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i winit > "$RUNNER_TEMP/winit-features.txt"
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i wgpu > "$RUNNER_TEMP/wgpu-features.txt"
          for feature in x11 wayland; do
            grep -E "(^|[[:space:]])winit feature \"$feature\"" "$RUNNER_TEMP/winit-features.txt"
          done
          for feature in vulkan gles; do
            grep -E "(^|[[:space:]])wgpu feature \"$feature\"" "$RUNNER_TEMP/wgpu-features.txt"
          done
      - name: Guard Windows renderer features
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo tree --locked -p keine --no-default-features --features ui-sounds -e normal,build,features -i wgpu > "$RUNNER_TEMP/wgpu-features.txt"
          for feature in dx12 vulkan gles; do
            grep -E "(^|[[:space:]])wgpu feature \"$feature\"" "$RUNNER_TEMP/wgpu-features.txt"
          done
      - if: matrix.quality
        run: cargo fmt --all -- --check
      - if: matrix.quality
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.quality
        run: cargo test --workspace
      - name: Check benchmark collector boundaries
        if: matrix.quality
        run: |
          python3 -m unittest discover -s tests/bench/runtime -p 'test_*.py'
          python3 -m unittest discover -s tests/packaging -p 'test_*.py'
      - name: Check publisher pipeline
        if: matrix.quality
        run: cargo test --workspace --no-default-features --features publisher
      # Select Engine and Editor together to unify their Bevy dev-dependencies.
      # libtest accepts several filters; Linux's workspace tests cover these too.
      - name: Check platform video, process metrics, benchmark contracts and system Trash
        run: >-
          cargo test --locked -p keine -p keine-editor --lib --no-default-features
          --features "${{ matrix.test_features }}" --
          scene::video:: preview::performance:: file_ops::assets:: portable_benchmark_
          runtime::bootstrap::tests::benchmark_ ui::support::performance::
          publisher::tests::native_release_
      - name: Check native display connection ownership
        run: cargo test --locked -p bevy_render --lib renderer::display_tests
      - name: Check platform video acceptance
        run: >-
          cargo run --locked --no-default-features --features "${{ matrix.test_features }}"
          --bin keine-video-acceptance -- tests/fixtures/video/playback.mp4
      # Keep the native test boundary without rodio; developer audio above must
      # not hide accidental audio references in otherwise audio-free tests.
      - name: Check native video tests without audio
        if: matrix.backend == 'native'
        run: cargo check --locked -p keine --tests --no-default-features --features video-native
      # Optimized linking/packaging belongs to Release and Project Release.
      # Platform tests above still link developer formats; check shipping separately.
      - name: Check canonical shipping feature set
        run: >-
          cargo check --locked --no-default-features
          --features "${{ matrix.shipping_features }}"
      - name: Save Rust build cache even after a test failure
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
