name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-video
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check typed video backend
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: cargo check --workspace --features video-ffmpeg
      - name: Check AVFoundation video backend
        if: runner.os == 'macOS'
        run: cargo check --workspace --features video-native
      - run: cargo build --release
