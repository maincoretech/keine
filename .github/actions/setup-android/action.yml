name: Setup Android SDK
description: Install the shared pinned Engine APK toolchain
inputs:
  cache-disabled:
    description: Disable Gradle caches for game builds containing runtime keys
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        gradle-version: '9.8.1'
        cache-disabled: ${{ inputs.cache-disabled }}
    - name: Install Android toolchain
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;36.0.0'
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Cache pinned cargo-ndk
      id: cargo-ndk
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/cargo-ndk
        key: cargo-ndk-${{ runner.os }}-${{ runner.arch }}-4.1.2
    - name: Add cargo-ndk to PATH
      shell: bash
      run: echo "${{ runner.tool_cache }}/cargo-ndk/bin" >> "$GITHUB_PATH"
    - name: Install pinned cargo-ndk
      if: steps.cargo-ndk.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-ndk --version 4.1.2 --locked --root "${{ runner.tool_cache }}/cargo-ndk"
