name: Verify Linux package
description: Load the final package in a clean Ubuntu 24.04 container without the build SDK

inputs:
  package:
    description: Final ZIP or formal release directory
    required: true

runs:
  using: composite
  steps:
    - name: Verify final Linux package on the supported baseline
      shell: bash
      env:
        PACKAGE_INPUT: ${{ inputs.package }}
      run: |
        set -euo pipefail
        package="$(realpath -e "$PACKAGE_INPUT")"
        checks="$(realpath "$GITHUB_ACTION_PATH/../../../dev/scripts")"
        fixture="$(realpath "$GITHUB_ACTION_PATH/../../../tests/fixtures/native-smoke")"
        docker run --rm \
          --mount "type=bind,source=$package,target=/input,readonly" \
          --mount "type=bind,source=$checks,target=/checks,readonly" \
          --mount "type=bind,source=$fixture,target=/native-smoke,readonly" \
          ubuntu:24.04 bash /checks/verify-linux-package.sh
