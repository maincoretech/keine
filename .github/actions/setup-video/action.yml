name: Setup video SDK
description: Install the FFmpeg libraries used by the Windows and Linux fallback backend

inputs:
  enabled:
    description: Install the optional FFmpeg SDK in addition to base platform libraries
    required: false
    default: "true"
  windows-triplet:
    description: vcpkg target triplet for the Windows FFmpeg SDK
    required: false
    default: x64-windows

runs:
  using: composite
  steps:
    - name: Install Linux native libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # GPUI's Linux backend links Fontconfig and XKB through pkg-config.
        packages=(
          libasound2-dev
          libfontconfig-dev
          libudev-dev
          libwayland-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          pkg-config
        )
        if [[ '${{ inputs.enabled }}' == 'true' ]]; then
          packages+=(
            libavcodec-dev libavformat-dev libavutil-dev
            libswscale-dev libswresample-dev
          )
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"

    - name: Cache Windows FFmpeg packages
      if: runner.os == 'Windows' && inputs.enabled == 'true'
      id: windows-ffmpeg-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-ffmpeg-${{ inputs.windows-triplet }}-${{ hashFiles('.github/actions/setup-video/vcpkg.json', '.github/actions/setup-video/triplets/*.cmake') }}-${{ github.sha }}
        restore-keys: |
          vcpkg-ffmpeg-${{ inputs.windows-triplet }}-${{ hashFiles('.github/actions/setup-video/vcpkg.json', '.github/actions/setup-video/triplets/*.cmake') }}-

    - name: Install Windows FFmpeg SDK
      if: runner.os == 'Windows' && inputs.enabled == 'true'
      shell: pwsh
      run: |
        $root = $env:VCPKG_INSTALLATION_ROOT
        if (-not $root) { throw 'GitHub runner did not provide VCPKG_INSTALLATION_ROOT' }
        $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
        New-Item -ItemType Directory -Force $cache | Out-Null
        $env:VCPKG_ROOT = $root
        $env:VCPKG_DEFAULT_BINARY_CACHE = $cache
        $triplet = '${{ inputs.windows-triplet }}'
        $manifest = '${{ github.action_path }}'
        "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VCPKG_TARGET_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append
        $installed = Join-Path $root 'installed'
        & (Join-Path $root 'vcpkg.exe') install "--x-manifest-root=$manifest" "--x-install-root=$installed" "--triplet=$triplet" "--overlay-triplets=$manifest/triplets"
        if ($LASTEXITCODE -ne 0) { throw "FFmpeg SDK installation failed: $LASTEXITCODE" }

    # `actions/cache` normally saves only after the whole job succeeds. Persist
    # the expensive vcpkg result immediately so a later test failure or a
    # superseding push does not force FFmpeg to rebuild from source again.
    - name: Save Windows FFmpeg packages
      if: runner.os == 'Windows' && inputs.enabled == 'true' && steps.windows-ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: ${{ steps.windows-ffmpeg-cache.outputs.cache-primary-key }}
