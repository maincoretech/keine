version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:35'
      timezone: Etc/UTC
    # Disable ordinary version PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '02:50'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
