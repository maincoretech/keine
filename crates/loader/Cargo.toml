[package]
name = "keine-loader"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Unified asset/source and script adapters with hot reload"

[features]
default = []
hot-reload = ["dep:notify"]

[dependencies]
keine-core = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
notify = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
crc32fast = { workspace = true }
postcard = { workspace = true }
hakutaku-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { workspace = true }
hakutaku-pack = { workspace = true }

[[bench]]
name = "program-load"
path = "../../tests/bench/loader/program/load.rs"
harness = false

[[bench]]
name = "content-lookup"
path = "../../tests/bench/loader/content/lookup.rs"
harness = false

[[bench]]
name = "letsgal-project"
path = "../../tests/bench/loader/letsgal/project.rs"
harness = false
