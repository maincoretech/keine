[package]
name = "keine-loader"
version.workspace = true
edition.workspace = true
description = "Unified asset/source and script adapters with hot reload"

[features]
default = []
hot-reload = ["dep:notify"]

[dependencies]
keine-core = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
notify = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
crc32fast = { workspace = true }
postcard = { workspace = true }
hakutaku-core = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
hakutaku-pack = { workspace = true }

[[bench]]
name = "program_load"
harness = false

[[bench]]
name = "content_lookup"
harness = false

[[bench]]
name = "letsgal_project"
harness = false
