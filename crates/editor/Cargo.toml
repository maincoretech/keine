[package]
name = "keine-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native GPUI editor for Kēne projects"
repository = "https://github.com/maincoretech/keine"
publish = false

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
lsp-types = { version = "=0.97.0", features = ["proposed"] }
fs2 = { workspace = true }
gpui-kit = { workspace = true }
image = { workspace = true }
keine-authoring = { workspace = true }
keine-core = { workspace = true }
keine-loader = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
] }
