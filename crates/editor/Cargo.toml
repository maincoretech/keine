[package]
name = "keine-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native GPUI editor for Kēne projects"
repository = "https://github.com/maincoretech/keine"
publish = false

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
fs2 = { workspace = true }
gpui-kit = { workspace = true }
image = { workspace = true }
keine-authoring = { workspace = true }
keine-core = { workspace = true }
keine-loader = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
] }
