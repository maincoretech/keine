[package]
name = "keine-editor"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
description = "Native GPUI editor for Kēne projects"
repository = "https://github.com/maincoretech/keine"
publish = false

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
lsp-types = { version = "=0.97.0", features = ["proposed"] }
fs2 = { workspace = true }
gpui-kit = { workspace = true }
image = { workspace = true }
keine-authoring = { workspace = true }
keine-core = { workspace = true }
keine-loader = { workspace = true }
keine-media = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.61.2", default-features = false }
windows-sys = { workspace = true }
windows = { version = "=0.61.3", default-features = false, features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSError", "NSString", "NSURL"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
] }

# Standalone Editor tests do not inherit the engine's Linux window backend.
[target.'cfg(target_os = "linux")'.dev-dependencies]
bevy = { workspace = true, features = ["x11"] }

[[bench]]
name = "browser"
path = "../../tests/bench/editor/browser.rs"
harness = false
