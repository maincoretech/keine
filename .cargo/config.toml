[alias]
# Native Editor development session. Additional arguments are project paths.
editor = "run --manifest-path crates/editor/Cargo.toml --"
# Interactive preview; add `--sync` to follow an open LetsGal project.
# Machines without FFmpeg development libraries can use
# `cargo run --features hot-reload -- dev` for the same session without video.
dev = "run --features hot-reload,video-native,video-ffmpeg -- dev"
validate = "run -- validate"
# Advanced measurement: normal frames or `--startup` isolated launches.
perf = "run --release --features startup-metrics,video-native,video-ffmpeg -- perf"
# Publisher-only resource package and reference migration.
pack = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- pack"
remap = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- remap"
# Keep the bundle runner outside target/release: Windows cannot replace a
# running keine.exe when the child build produces the hardened game engine.
bundle = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- bundle"
# One-shot compatibility conversion. The source stays read-only and the new
# target is published only after the generated Eiyashou project validates.
migrate = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- migrate"
