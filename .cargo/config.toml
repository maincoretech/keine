[alias]
adapters = "run -- adapters"
# Interactive preview; add `--sync` to follow an open LetsGal project the
# same way the former `studio-sync` command did.
# Machines without FFmpeg development libraries can use `cargo run -- dev`
# for the same session without video backends.
dev = "run --features video-native,video-ffmpeg -- dev"
# Optimized interactive preview. Keeping `--release` inside the alias avoids
# leaking Cargo's option ordering into the project-facing command line.
preview = "run --release --features video-native,video-ffmpeg -- dev"
# Repeatable release-mode runtime capture. The optional final argument is the
# sampling duration in seconds (default: 15, after a 3-second warm-up); a
# second optional argument selects the compiled action cursor. A final profile
# (`full`, `scene-ui`, `scene-dialog`, or `scene`) is reserved for measuring
# per-camera render overhead without changing normal runtime composition.
perf = "run --release --features video-native,video-ffmpeg -- benchmark"
validate = "run -- check"
# Build-time compilation of a source project into `.keine/compiled/program.bin`.
compiler = "run -- compiler"
# Process-to-first-frame segment timing (T-1..T7); `--compiled` forces the
# compiled program.bin loading path for A/B comparison.
startup = "run -- startup"
