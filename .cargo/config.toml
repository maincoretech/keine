[alias]
configure = "run -- configure"
# Compatibility alias for the former adapter-only configuration screen.
adapters = "configure"
# Interactive preview; add `--sync` to follow an open LetsGal project the
# same way the former `studio-sync` command did.
# Machines without FFmpeg development libraries can use `cargo run -- dev`
# for the same session without video backends.
dev = "run --features video-native,video-ffmpeg -- dev"
# Repeatable release-mode runtime capture. The optional final argument is the
# sampling duration in seconds (default: 15, after a 3-second warm-up); a
# second optional argument selects a stable timeline id (a numeric cursor is
# retained only as a low-level escape hatch). A final profile
# (`full`, `scene-ui`, `scene-dialog`, or `scene`) is reserved for measuring
# per-camera render overhead without changing normal runtime composition.
perf = "run --release --features video-native,video-ffmpeg -- benchmark"
# Builds once, then lets the release executable spawn isolated child processes
# and report startup medians/p95 without including Cargo in the measurements.
startup-perf = "run --release --features startup-metrics -- benchmark-startup"
validate = "run -- check"
# Publisher-only asset operations. Packing writes Hakutaku content without
# building an engine; remapping updates project references transactionally.
assets = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- assets"
# Keep the bundle runner outside target/release: Windows cannot replace a
# running keine.exe when the child build produces the hardened game engine.
bundle = "run --release --no-default-features --features publisher --target-dir target/publisher-runner -- bundle"
